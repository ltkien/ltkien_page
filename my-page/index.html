<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="todo-app">
        <h1>Todo List</h1>

        <div class="todo-form">
            <input type="text" id="todoInput" placeholder="Nhập công việc...">

            <button id="addBtn">
                Thêm
            </button>
        </div>

        <ul id="todoList"></ul>
        <button onclick="window.location.href='love/love.html'">
            ❤️ Love
        </button>
    </main>

    <script src="script.js"></script>
</body>

</html>
